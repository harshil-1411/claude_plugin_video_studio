<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">video-studio: a knowledge-to-video compiler</title>
  <desc id="d">Source documents flow through ingest, plan, render, QA and export into three vertical platform packages with captions placed clear of each app's UI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8CFF" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="mask" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F5F7FA" fill-opacity="0.04"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#F5F7FA" stroke-opacity="0.18" stroke-width="3"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="78" class="sans" font-size="44" font-weight="700" fill="#F5F7FA">video-studio</text>
  <text x="60" y="112" class="sans" font-size="19" fill="#9aa4b8">Compile documents, repos and footage into reproducible, platform-ready videos.</text>

  <!-- sources -->
  <g transform="translate(60 160)">
    <g>
      <rect x="0" y="16" width="104" height="132" rx="8" fill="#1a2336" stroke="#2b3752"/>
      <rect x="14" y="0" width="104" height="132" rx="8" fill="#1f2a40" stroke="#34425f"/>
      <rect x="28" y="30" width="72" height="7" rx="3" fill="#F5F7FA" fill-opacity="0.85"/>
      <rect x="28" y="48" width="60" height="5" rx="2.5" fill="#F5F7FA" fill-opacity="0.35"/>
      <rect x="28" y="60" width="66" height="5" rx="2.5" fill="#F5F7FA" fill-opacity="0.35"/>
      <rect x="28" y="72" width="48" height="5" rx="2.5" fill="#4F8CFF" fill-opacity="0.9"/>
      <rect x="28" y="84" width="62" height="5" rx="2.5" fill="#F5F7FA" fill-opacity="0.35"/>
      <rect x="28" y="96" width="40" height="5" rx="2.5" fill="#F5F7FA" fill-opacity="0.35"/>
    </g>
    <text x="0" y="178" class="mono" font-size="13" fill="#9aa4b8">md · pdf · url · repo · mp4</text>
  </g>

  <!-- compiler rail -->
  <g transform="translate(210 238)">
    <rect x="0" y="-2" width="520" height="4" rx="2" fill="url(#rail)"/>
    <g class="mono" font-size="13" fill="#F5F7FA" text-anchor="middle">
      <g transform="translate(40 0)"><circle r="9" fill="#0B0F19" stroke="#4F8CFF" stroke-width="3"/><text y="-22">ingest</text></g>
      <g transform="translate(150 0)"><circle r="9" fill="#0B0F19" stroke="#4F8CFF" stroke-width="3"/><text y="-22">plan</text></g>
      <g transform="translate(260 0)"><circle r="9" fill="#0B0F19" stroke="#4F8CFF" stroke-width="3"/><text y="-22">render</text></g>
      <g transform="translate(370 0)"><circle r="9" fill="#0B0F19" stroke="#22C55E" stroke-width="3"/><text y="-22">lint · QA</text></g>
      <g transform="translate(480 0)"><circle r="9" fill="#22C55E"/><text y="-22">dist/</text></g>
    </g>
    <text x="260" y="44" class="sans" font-size="14" fill="#9aa4b8" text-anchor="middle">grounded spec → cached scenes → captions → per-platform packages</text>
  </g>

  <!-- three 9:16 frames with UI safe-zone masks and a caption plate -->
  <g class="sans">
    <g transform="translate(790 138)">
      <rect width="108" height="192" rx="12" fill="#161f33" stroke="#34425f" stroke-width="2"/>
      <rect x="0" y="0" width="108" height="16" rx="12" fill="url(#mask)"/>
      <rect x="92" y="74" width="16" height="86" fill="url(#mask)"/>
      <rect x="0" y="160" width="108" height="32" rx="12" fill="url(#mask)"/>
      <text x="16" y="72" font-size="17" font-weight="700" fill="#F5F7FA">680K</text>
      <text x="16" y="88" font-size="9" fill="#9aa4b8">hours of audio</text>
      <rect x="14" y="126" width="72" height="18" rx="4" fill="#000" fill-opacity="0.6"/>
      <text x="50" y="139" font-size="9" fill="#F5F7FA" text-anchor="middle">clear of the <tspan fill="#4F8CFF">UI</tspan></text>
      <text x="54" y="214" font-size="12" fill="#9aa4b8" text-anchor="middle">TikTok</text>
    </g>
    <g transform="translate(916 138)">
      <rect width="108" height="192" rx="12" fill="#161f33" stroke="#34425f" stroke-width="2"/>
      <rect x="0" y="0" width="108" height="14" rx="12" fill="url(#mask)"/>
      <rect x="90" y="84" width="18" height="70" fill="url(#mask)"/>
      <rect x="0" y="154" width="108" height="38" rx="12" fill="url(#mask)"/>
      <rect x="14" y="44" width="80" height="34" rx="5" fill="none" stroke="#22C55E" stroke-width="2"/>
      <text x="54" y="66" font-size="11" fill="#F5F7FA" text-anchor="middle">After</text>
      <rect x="14" y="120" width="72" height="18" rx="4" fill="#000" fill-opacity="0.6"/>
      <text x="50" y="133" font-size="9" fill="#F5F7FA" text-anchor="middle">one <tspan fill="#22C55E">command</tspan></text>
      <text x="54" y="214" font-size="12" fill="#9aa4b8" text-anchor="middle">Reels</text>
    </g>
    <g transform="translate(1042 138)">
      <rect width="108" height="192" rx="12" fill="#161f33" stroke="#34425f" stroke-width="2"/>
      <rect x="0" y="0" width="108" height="18" rx="12" fill="url(#mask)"/>
      <rect x="92" y="90" width="16" height="64" fill="url(#mask)"/>
      <rect x="0" y="154" width="108" height="38" rx="12" fill="url(#mask)"/>
      <text x="16" y="66" font-size="14" font-weight="700" fill="#F5F7FA">Docs in.</text>
      <text x="16" y="84" font-size="14" font-weight="700" fill="#4F8CFF">Video out.</text>
      <rect x="14" y="120" width="72" height="18" rx="4" fill="#000" fill-opacity="0.6"/>
      <text x="50" y="133" font-size="9" fill="#F5F7FA" text-anchor="middle">grounded in <tspan fill="#4F8CFF">sources</tspan></text>
      <text x="54" y="214" font-size="12" fill="#9aa4b8" text-anchor="middle">Shorts</text>
    </g>
    <text x="970" y="378" font-size="12" fill="#9aa4b8" text-anchor="middle">hatched = platform UI · captions stay clear</text>
  </g>
</svg>
