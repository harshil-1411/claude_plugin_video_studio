# ByteDance Seedance 2.0 / 2.5. Facts are hypotheses read on verified_on; hosts disagree in places
# (see notes). Re-check the live docs and flip `verified` only then (docs/contributing/providers.md).
schema_version: "1.0"
id: seedance
name: ByteDance Seedance 2.0 / 2.5
models:
  - id: seedance-2.0
    label: Seedance 2.0
    modes: [text_to_video, image_to_video, first_last_frame, reference_to_video]
    notes:
      - "image_url plus an optional end_image_url gives first-to-last-frame generation."
      - "References: up to 9 images, 3 videos (2-15 s combined), 3 audio files, 12 files in total."
  - id: seedance-2.5
    label: Seedance 2.5 (launched 2026-07-31)
    modes: [text_to_video, image_to_video, first_last_frame, reference_to_video]
    notes:
      - "4-30 s in 1 s steps; up to 30 images, 10 videos, 10 audio files, 50 files in total."
      - "Bracket channels: ( ) music or ambience, < > sound effects, { } spoken dialogue, 【 】 on-screen text."
      - "Long clips use [Generation Goal], [Stage 1..n] and [Maintain Consistency] sections."
duration:
  min_sec: 4
  max_sec: 15
aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
resolutions: ["480p", "720p"]
references:
  max_images: 9
  max_videos: 3
  max_audio: 3
  syntax: "@Image{n}"
audio:
  native: true
  syntax: >-
    Native audio is on by default. 2.0: describe dialogue, sound effects and ambience in plain
    sentences. 2.5: ( ) music or ambience, < > sound effects, { } spoken dialogue, 【 】 on-screen text.
negatives: unsupported
multi_shot:
  max_shots: 4
  syntax: >-
    First line states the shot count, total duration and aspect ratio; then numbered shots
    (Shot 1: ..., Shot 2: ...).
prompt_formula: >-
  subject + action (required), then optional scene, style, camera/cut and audio; 2-3 sentences;
  name each reference (@Image1, @Video1, @Audio1) and state its role.
access:
  - via: fal
    env: FAL_KEY
    docs_url: https://fal.ai/models?keywords=seedance
  - via: direct
    env: ARK_API_KEY
    docs_url: https://docs.byteplus.com/en/docs/ModelArk
source_urls:
  - https://seed.bytedance.com/en/seedance2_0
  - https://docs.byteplus.com/en/docs/ModelArk
  - https://fal.ai/models?keywords=seedance
verified_on: "2026-09-27"
verified: false
notes:
  - "Family limits are the Seedance 2.0 ones (4-15 s, 9 images / 3 videos / 3 audio); 2.5 allows 4-30 s and larger reference sets (see the model notes)."
  - "Conflict: fal lists 480p and 720p; some hosts claim 1080p. Kept 480p/720p until re-checked."
  - "Duration may also be 'auto' on some hosts."
  - "Model ids differ per host (fal endpoint paths, ModelArk model ids); re-check before use."
  - "max_shots 4 is a working assumption; the per-clip shot limit is not documented."
