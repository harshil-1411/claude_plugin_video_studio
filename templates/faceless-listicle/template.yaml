# Archetype: faceless numbered list driven by kinetic type and stats, no presenter.
schema_version: "1.0"
id: faceless-listicle
name: Faceless listicle
description: Numbered list without a presenter - kinetic text and stat cards carry each item, fast cuts, and an ending that loops back to the hook.
goals: [educate, promote, explain]
platforms: [tiktok, instagram_reels, youtube_shorts, x, linkedin]
default_aspect_ratio: "9:16"
default_duration_sec: 30
duration_range: { min_sec: 15, max_sec: 60 }
pacing: { avg_shot_sec: 3.5, max_words_per_sec: 3.3 }
caption_preset: bold
beats:
  - purpose: hook
    share: 0.10
    guidance: Promise the count and the payoff ("3 numbers that ..."). The count must match the point scenes.
    suggested_visual_strategy: motion_graphic
    suggested_deterministic_kind: kinetic_text
  - purpose: point
    share: 0.20
    guidance: Item 1 as a big number or word with one line of context. Number it on screen.
    suggested_visual_strategy: motion_graphic
    suggested_deterministic_kind: stat
  - purpose: point
    share: 0.20
    guidance: Item 2 in the same shape as item 1 so the rhythm is predictable.
    suggested_visual_strategy: motion_graphic
    suggested_deterministic_kind: kinetic_text
  - purpose: point
    share: 0.20
    guidance: Item 3, the strongest or most surprising; save it for last.
    suggested_visual_strategy: motion_graphic
    suggested_deterministic_kind: stat
  - purpose: loop_back
    share: 0.14
    guidance: Tie the list back to the hook's words so the ending flows into a rewatch.
    suggested_visual_strategy: motion_graphic
    suggested_deterministic_kind: kinetic_text
    optional: true
  - purpose: cta
    share: 0.16
    guidance: One action (save, follow for more) that matches desired_action.
    suggested_visual_strategy: motion_graphic
    suggested_deterministic_kind: cta
hook_mechanisms: [promise, statistic, curiosity_gap, pattern_interrupt]
rules:
  - No presenter and no footage; type and stat cards carry the video.
  - One item per scene, numbered on screen; add or remove point scenes to match the promised count.
  - Each item's number or claim cites a ContentIR ref in claim_refs.
  - Kinetic text is at most 8 words per scene so it can be read at this pace.
  - CTA must be an allowed brand CTA if a brand profile is present.
default_style: energetic
