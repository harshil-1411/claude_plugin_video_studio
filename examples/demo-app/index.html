<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Notes (demo app)</title>
<style>
  body { font: 18px system-ui, sans-serif; margin: 0; background: #f6f7fb; color: #111827; }
  header { background: #4F8CFF; color: #fff; padding: 18px 24px; font-weight: 700; }
  main { padding: 24px; max-width: 520px; }
  button { font: inherit; padding: 12px 18px; border: 0; border-radius: 8px; background: #22C55E; color: #fff; cursor: pointer; }
  input { font: inherit; padding: 10px; width: 100%; box-sizing: border-box; margin: 12px 0; border: 1px solid #ccd; border-radius: 8px; }
  #plan { margin-top: 24px; padding: 18px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #0001; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>Acme Notes</header>
<main>
  <h2>Turn notes into a plan</h2>
  <button id="start" onclick="document.getElementById('form').classList.remove('hidden')">Get started</button>
  <div id="form" class="hidden">
    <input id="email" placeholder="you@example.com">
    <button id="go" onclick="document.getElementById('plan').classList.remove('hidden')">Create plan</button>
  </div>
  <div id="plan" class="hidden">
    <b>Your plan</b>
    <ol><li>Ingest your notes</li><li>Draft a storyboard</li><li>Render a reel</li></ol>
  </div>
  <div style="height: 900px"></div>
</main>
</body>
</html>
